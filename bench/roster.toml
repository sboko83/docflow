# The routes a benchmark run uses, in the v4 format: the accesses in
# priority order, each with its row of the role table. The catalog of these
# accesses is catalog.json beside this file: a benchmark must resolve the
# same routes on every machine, so it reads the fixture instead of a scan
# of the developer's own roster.
version = 4

[access.zai]
agents = ["pi"]

[access.zai.roles]
executor   = "glm-5.3-flash@high"
cheap      = "glm-5.3-flash@high"
heavy      = "glm-5.3@max"
review     = "glm-5.3-flash@high"
acceptance = "glm-5.3-flash@high"
replan     = "glm-5.3@max"

[access.codex]
agents = ["codex"]

[access.codex.roles]
executor   = "gpt-6-luna@high"
cheap      = "gpt-6-luna@high"
heavy      = "gpt-6.1-sol@high"
review     = "gpt-6-luna@high"
acceptance = "gpt-6-luna@high"
replan     = "gpt-6.1-sol@high"
