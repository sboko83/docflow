# The routes a benchmark run uses, in the v2 format. The catalog of these
# accesses is catalog.json beside this file: a benchmark must resolve the
# same routes on every machine, so it reads the fixture instead of a scan
# of the developer's own roster.
version = 2

[access.zai]
agents  = ["pi"]
budget  = "normal"
trusted = true
models  = ["glm-5.3", "glm-5.3-flash"]

[access.codex]
agents  = ["codex"]
budget  = "normal"
trusted = true
models  = ["gpt-6-luna", "gpt-6.1-sol"]

[model."codex/gpt-6-luna"]
class = "standard"

[model."codex/gpt-6.1-sol"]
class = "strong"

[model."zai/glm-5.3"]
class = "strong"

[model."zai/glm-5.3-flash"]
class = "cheap"

[role]
cheap      = "cheap"
executor   = "cheap"
heavy      = "strong"
review     = "cheap"
acceptance = "cheap"
replan     = "trusted"

[effort]
"codex/gpt-6-luna"  = "high"
"codex/gpt-6.1-sol" = "high"
"zai/glm-5.3"       = "max"
"zai/glm-5.3-flash" = "high"
