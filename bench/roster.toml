# The routes a benchmark run uses, in the v3 format. The catalog of these
# accesses is catalog.json beside this file: a benchmark must resolve the
# same routes on every machine, so it reads the fixture instead of a scan
# of the developer's own roster.
version = 3

[access.zai]
agents  = ["pi"]
budget  = "normal"
trusted = true
models  = ["glm-5.3", "glm-5.3-flash"]

[access.codex]
agents  = ["codex"]
budget  = "normal"
trusted = true
models  = ["gpt-6-luna", "gpt-6.1-sol"]

[route."codex/gpt-6-luna"]
high = "standard"

[route."codex/gpt-6.1-sol"]
high = "strong"

[route."zai/glm-5.3"]
max = "strong"

[route."zai/glm-5.3-flash"]
high = "cheap"

[role]
cheap      = "cheap"
executor   = "cheap"
heavy      = "strong"
review     = "cheap"
acceptance = "cheap"
replan     = "trusted"
