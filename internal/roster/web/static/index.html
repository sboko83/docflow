<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>docflow · ростер</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="rwe" class="rw">
  <div class="rw-header">
    <h1 class="rw-title">docflow · ростер</h1>
    <span class="rw-subtitle">какая модель закрывает какую роль плана</span>
  </div>

  <div class="rw-toolbar">
    <div class="rw-switch" id="rwe-switch" role="tablist" aria-label="Политики"></div>
    <div class="rw-actions">
      <button type="button" class="rw-btn" id="rwe-reload" title="Перечитать ростер с сервера">Перечитать</button>
    </div>
  </div>

  <div class="rw-body">
    <div class="rw-val" id="rwe-val" role="alert" aria-live="polite"></div>

    <div class="rw-polhead" id="rwe-polhead"></div>

    <div class="rw-sectitle">Таблица ролей <span class="rw-sechint" id="rwe-hint"></span></div>
    <div class="rw-tablewrap">
      <table class="rw-table" id="rwe-table"></table>
    </div>
    <div class="rw-addrow">
      <button type="button" class="rw-btn" id="rwe-add-access">+ доступ из каталога</button>
      <span class="rw-muted" id="rwe-catalog-left"></span>
    </div>

    <div class="rw-sectitle">Цепочки <span class="rw-sechint">столбец таблицы сверху вниз; выключенные доступы пропущены; первый маршрут основной, остальные — fallback</span></div>
    <div class="rw-chains" id="rwe-chains"></div>
    <div class="rw-warnings" id="rwe-warnings"></div>
  </div>

  <div class="rw-overlay" id="rwe-overlay">
    <div class="rw-modal" id="rwe-modal" role="dialog" aria-modal="true"></div>
  </div>

  <div class="rw-toasts" id="rwe-toasts"></div>
</div>
<script src="app.js"></script>
</body>
</html>
