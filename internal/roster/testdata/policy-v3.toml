version = 3

[access.opencode-go]
agents  = ["pi", "opencode"]
kind    = "subscription"
budget  = "prefer"
trusted = true
models  = ["deepseek-*"]

[access.zai]
agents  = ["pi"]
kind    = "subscription"
budget  = "lean"
check   = true
models  = ["glm-5.3*"]
exclude = ["glm-5.3-thinking"]
expires = "2026-06-30"

[access.codex]
agents  = ["codex"]
kind    = "subscription"
budget  = "minimal"
trusted = true

[access.claude]
agents  = ["claude"]
kind    = "subscription"
budget  = "off"
trusted = true

# opencode and opencode-go are different accesses: separate quotas even
# when the same OpenCode Go subscription is reachable through both.
[access.opencode]
agents = ["opencode"]
kind   = "metered"
budget = "off"

[access.local]
agents = ["pi"]
kind   = "local"
budget = "off"
check  = true

# The class belongs to the pair of a model and an effort: the same model
# can be cheap at low effort and standard at high. A model without a
# route is served at its automatic class with the class ladder effort.
[route."opencode-go/deepseek-v4.1-flash"]
high = "cheap"

[route."opencode-go/deepseek-v4.1"]
high = "standard"

[route."zai/glm-5.3-flash"]
low = "cheap"

[route."zai/glm-5.3"]
max = "strong"

[route."codex/gpt-6-luna"]
low = "cheap"

[route."codex/gpt-6.1-sol"]
medium = "strong"

[role]
cheap      = "cheap"
executor   = "standard"
heavy      = "strong"
review     = "standard"
acceptance = "trusted"
replan     = "trusted"

# The acceptance scenario: claude and the local model are off, codex runs
# at minimal, zai is limited to flash, opencode-go opens the order.
[preset.low]
off     = ["claude", "local"]
lean    = ["zai"]
minimal = ["codex"]
prefer  = ["opencode-go"]
order   = ["opencode-go", "zai", "codex"]
models  = { zai = ["*flash*"] }
