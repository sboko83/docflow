# The P036 draft as a version 4 table: zai is the check access (its units
# need an independent review), codex and claude judge. draft-v3.toml is the
# same roster in version 3, draft-v1.toml in version 1; draft.variants.toml
# holds the codex-first policy.
version = 4

[access.zai]
agents = ["pi"]
check = true

[access.zai.roles]
executor   = "glm-5.3-flash@max"
cheap      = "glm-5.3-flash@max"
heavy      = "glm-5.3@max"

[access.codex]
agents = ["codex"]

[access.codex.roles]
executor   = "gpt-6-luna@max"
cheap      = "gpt-6-luna@max"
heavy      = "gpt-6.1-sol@high"
review     = "gpt-6.1-sol@high"
acceptance = "gpt-6.1-sol@high"
replan     = "gpt-6.1-sol@high"

[access.claude]
agents = ["claude"]

[access.claude.roles]
executor   = "claude-sonnet-5-5@high"
cheap      = "claude-haiku-5-5"
heavy      = "claude-opus-5-5@high"
review     = "claude-opus-5-5@high"
acceptance = "claude-opus-5-5@high"
replan     = "claude-opus-5-5@high"
