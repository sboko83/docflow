name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      # One OS failing must not cancel the others: each result is needed.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go build -o "bin/docflow$(go env GOEXE)" ./cmd/docflow
      - run: bash tools/parity/run.sh "bin/docflow$(go env GOEXE)" "bin/docflow$(go env GOEXE)"
      # python3 is the Microsoft Store stub on Windows; python is the same
      # interpreter everywhere else.
      - run: PYTHONDONTWRITEBYTECODE=1 python3 tools/test-context-audits.py
        if: runner.os != 'Windows'
      - run: PYTHONDONTWRITEBYTECODE=1 python tools/test-context-audits.py
        if: runner.os == 'Windows'
      - run: bash tools/test-install.sh
      - run: bash tools/test-smoke-run.sh
      - run: bash tools/test-install-ps1.sh
        if: runner.os == 'Windows'
