name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check tag matches version
        run: bash tools/check-release-tag.sh "$GITHUB_REF_NAME"
      - name: Extract release notes
        run: bash tools/release-notes.sh "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/notes.md"
      - run: go test ./...
      - run: bash tools/release.sh "${GITHUB_REF_NAME#v}" dist
      - name: Create GitHub release
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$TAG" --title "$TAG"
          --notes-file "$RUNNER_TEMP/notes.md"
          dist/download/"$TAG"/*

  # Install the published release the way users do and run it.
  smoke:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Install with curl | sh
        run: >-
          curl -fsSL
          "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_REF_NAME/install.sh"
          | sh
      - name: Check the installed release
        run: |
          set -eu
          bin=$HOME/.docflow/bin/docflow
          case "$(uname -s)" in
            MINGW*|MSYS*|CYGWIN*) bin="$(cygpath -u "$USERPROFILE")/.docflow/current/docflow.exe" ;;
          esac
          want=${GITHUB_REF_NAME#v}
          "$bin" --version | grep -F "$want"
          "$bin" update --check | grep -Fx "up to date: $want"
          mkdir "$RUNNER_TEMP/project" && cd "$RUNNER_TEMP/project"
          git init -q
          "$bin" init
          "$bin" status
